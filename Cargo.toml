[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/badge-app", "crates/badgectl"]
# Patched copies of dependencies (see vendor/README.md), not ours to lint or
# format.
exclude = ["vendor"]

[workspace.package]
version = "0.2.2"
edition = "2024"
# The oldest Rust that builds it (`assert_matches!` needs 1.96); cargo says
# so clearly on an older one.
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/uintdev/led-badge-studio"

# Cargo.lock holds one crate below its latest version on purpose, so
# `cargo update` needs this line after it:
#   cargo update -p flate2 --precise 1.1.9    (1.1.10 brings a second copy
#                                              of miniz_oxide; see badge-render)
[workspace.dependencies]
badge-core = { path = "crates/badge-core" }
badge-io = { path = "crates/badge-io" }
badge-render = { path = "crates/badge-render" }
badge-formats = { path = "crates/badge-formats" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "gif", "jpeg", "ico"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2
debug = false

# Smallest binaries without giving up speed: whole-program LTO in one unit
# and no unwinding cut the app by about a quarter and badgectl by 40%.
# opt-level "s" would save more but makes exports about 5x slower.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# A dependency with a local fix, until it's fixed upstream (vendor/README.md).
[patch.crates-io]
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
