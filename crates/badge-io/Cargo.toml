[package]
name = "badge-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "USB HID and serial transports for LED name badges"

[dependencies]
badge-core.workspace = true
thiserror.workspace = true
chrono.workspace = true
log = "0.4"
serialport = { version = "4.10", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation"] }

[target.'cfg(not(any(target_os = "linux", windows)))'.dependencies]
hidapi = { version = "2.6" }

# Device notifications (src/hotplug.rs). Both are already used by serialport
# on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
io-kit-sys = "0.4"
core-foundation-sys = "0.8"
