# Rust for building the Flatpak: written by build.sh before each build, with
# the same version as the Rust outside Flatpak (`rustc --version`, brought up
# to date with `rustup update stable` first), or the latest stable release
# when there's none. Checksums from static.rust-lang.org. Only for building:
# removed before the app is packaged.
name: rust
buildsystem: simple
cleanup:
  - /rust
build-commands:
  - >-
    ./install.sh --prefix=/app/rust --disable-ldconfig
    --components=rustc,cargo,rust-std-$(uname -m)-unknown-linux-gnu
sources:
  - type: archive
    only-arches: [x86_64]
    url: https://static.rust-lang.org/dist/rust-1.100.0-x86_64-unknown-linux-gnu.tar.xz
    sha256: 98ee6bec240e1cfe944f17e7092412dc5ef6e008484bb668c6936d35a7d15acd
  - type: archive
    only-arches: [aarch64]
    url: https://static.rust-lang.org/dist/rust-1.100.0-aarch64-unknown-linux-gnu.tar.xz
    sha256: a21f6a21818df07c1e2e7addb570af5444b3fa9dd61e3a207f4fb1c5a5e665c9
