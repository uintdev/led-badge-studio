# The branding tool: applies branding.toml (name, copyright, logo) to the app
# icons and packaging files. Kept out of the main workspace so its libraries
# aren't counted as part of the shipped app.
[package]
name = "branding"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = "0.49"

[profile.release]
opt-level = 3
